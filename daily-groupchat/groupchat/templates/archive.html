<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Daily Groupchat · All issues</title>
<style>
  :root { --paper: #f4efe4; --ink: #1b1a17; --muted: #5d574c; --accent: #9b2c1f;
    --serif: "Iowan Old Style", "Palatino", "Georgia", serif;
    --sans: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d3c5; }
  .paper { max-width: 540px; margin: 0 auto; padding: 22px 24px 26px; background: var(--paper);
    color: var(--ink); font-family: var(--serif); min-height: 100vh; }
  .masthead { text-align: center; font-family: "Old English Text MT", var(--serif); font-size: 40px;
    line-height: 1; margin: 6px 0 4px; }
  .sub { text-align: center; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink);
    padding: 4px 0; font: 600 10px/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  ol { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--ink); }
  a { display: block; padding: 14px 0; color: inherit; text-decoration: none; }
  .meta { font: 12px/1.3 var(--sans); color: var(--muted); }
  .headline { font-size: 19px; line-height: 1.2; font-weight: 700; margin-top: 4px; }
  a:hover .headline { text-decoration: underline; }
  .back { display: inline-block; padding: 0; margin-top: 18px; font: 600 13px/1.3 var(--sans);
    border-bottom: 1px solid currentColor; }
</style>
</head>
<body>
<div class="paper">
  <div class="masthead">The Daily Groupchat</div>
  <div class="sub">All issues · {{ chat_name }}</div>
  <ol>
    {% for page in issues %}
    <li><a href="issue-{{ page.issue_number }}.html">
      <div class="meta">No. {{ page.issue_number }} · {{ page.dates }}</div>
      <div class="headline">{{ page.headline }}</div>
    </a></li>
    {% endfor %}
  </ol>
  <a class="back" href="index.html">← Latest issue</a>
</div>
</body>
</html>
